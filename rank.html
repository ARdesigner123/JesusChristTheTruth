<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ranks · Jesus Christ The Truth</title>
    <meta name="theme-color" content="#090f2e">
    <link rel="icon" href="static/image/jesusLogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="static/css/theme.css">
    <link rel="stylesheet" href="static/css/rank.css">
</head>
<body data-page="rank" data-auth="user">
<main class="container">
    <section class="rank-hero hero-enter">
        <span class="eyebrow">Grow in Faith</span>
        <div class="medallion" id="medallion"><div class="m-ring"></div><div class="m-ring r2"></div><i class="fas fa-magnifying-glass" id="m-icon"></i></div>
        <h1 class="page-title" id="rank-name">…</h1>
        <p class="lead" id="rank-verse"></p>
        <div class="rank-progress">
            <div class="rp-row"><span><b id="xp-now">0</b> XP</span><span id="xp-next"></span></div>
            <div class="progress sky"><span id="xp-bar"></span></div>
            <p class="text-muted" id="xp-hint"></p>
        </div>
    </section>

    <section class="section-tight">
        <div class="section-head" data-reveal="up">
            <h2>The Ladder of Faith</h2>
            <p>Earn XP from quizzes, quests, milestones and leaderboard rewards to ascend.</p>
        </div>
        <ol class="ladder" id="ladder"></ol>
        <div class="center" style="margin-top:36px"><a href="profile.html" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> Back to Profile</a></div>
    </section>
</main>
<script src="static/js/config.js"></script>
<script src="static/js/api.js"></script>
<script src="static/js/layout.js"></script>
<script>
(function () {
    const J = window.JCT, $ = id => document.getElementById(id);
    if (!J.getSession()) return;
    function render(xp) {
        const r = J.rankFor(xp);
        $('rank-name').textContent = r.name;
        $('m-icon').className = 'fas ' + r.icon;
        $('rank-verse').textContent = '“' + r.verse.replace(' — ', '” — ');
        $('xp-now').textContent = J.fmtNum(xp);
        $('xp-next').textContent = r.maxed ? 'MAX RANK' : `${J.fmtNum(r.next)} XP · ${r.nextName}`;
        $('xp-hint').textContent = r.maxed ? 'You have finished the race. Well done, good and faithful servant.' : `${J.fmtNum(r.next - xp)} XP to go`;
        setTimeout(() => { $('xp-bar').style.width = r.pct + '%'; }, 300);
        $('ladder').innerHTML = J.RANKS.slice().reverse().map((k, ri) => {
            const i = J.RANKS.length - 1 - ri;
            const state = i < r.index ? 'unlocked' : i === r.index ? 'current' : 'locked';
            return `<li class="rung ${state}" data-reveal="${i % 2 ? 'right' : 'left'}">
                <div class="r-icon"><i class="fas ${state === 'locked' ? 'fa-lock' : k.icon}"></i></div>
                <div class="r-text"><h3>${k.name} ${state === 'current' ? '<span class="chip sky">You are here</span>' : ''}</h3>
                <p>${k.xp ? J.fmtNum(k.xp) + ' XP' : 'Where every journey begins'}</p><em>${J.esc(k.verse)}</em></div>
                <span class="r-level">${i + 1}</span></li>`;
        }).join('');
        window.JCTReveal && window.JCTReveal();
    }
    J.call('jct_sync_time', { p_seconds: 0 }).then(d => render(d.xp || 0)).catch(e => J.toast(e.message, 'error'));
})();
</script>
</body>
</html>
