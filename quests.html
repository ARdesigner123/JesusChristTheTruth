<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Quests · Jesus Christ The Truth</title>
    <meta name="theme-color" content="#090f2e">
    <link rel="icon" href="static/image/jesusLogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="static/css/theme.css">
    <link rel="stylesheet" href="static/css/quests.css">
</head>
<body data-page="quests" data-auth="user">
<main>
    <header class="page-hero">
        <div class="hero-halo"></div>
        <div class="hero-container hero-enter">
            <span class="eyebrow">Sacred Tasks</span>
            <h1 class="page-title">Spiritual Quests</h1>
            <p class="lead">“Let us run with perseverance the race marked out for us.” — Hebrews 12:1</p>
        </div>
    </header>

    <div class="container quests-wrap">
        <div class="center" data-reveal="up">
            <div class="tabs" id="main-tabs">
                <button class="tab active" data-main="quests"><i class="fas fa-scroll"></i> Quests</button>
                <button class="tab" data-main="achievements"><i class="fas fa-medal"></i> Achievements</button>
            </div>
        </div>

        <section id="sec-quests">
            <div class="quest-bar glass" data-reveal="up">
                <div class="tabs" id="period-tabs">
                    <button class="tab active" data-period="daily">Daily</button>
                    <button class="tab" data-period="weekly">Weekly</button>
                    <button class="tab" data-period="monthly">Monthly</button>
                </div>
                <div class="quest-timer"><i class="fas fa-hourglass-half"></i> Refreshes in <b id="quest-countdown">--:--:--</b></div>
                <div class="quest-summary" id="quest-summary"></div>
            </div>
            <h2 class="q-heading"><i class="fas fa-fire-flame-curved"></i> In Progress</h2>
            <div class="quest-grid" id="active-list"></div>
            <h2 class="q-heading done"><i class="fas fa-circle-check"></i> Completed</h2>
            <div class="quest-grid" id="done-list"></div>
        </section>

        <section id="sec-achievements" hidden>
            <p class="center text-muted" style="margin:18px 0 26px">Legendary feats of faith — unlocked automatically as you grow.</p>
            <div class="ach-grid" id="ach-grid"></div>
        </section>
    </div>
</main>

<script src="static/js/config.js"></script>
<script src="static/js/api.js"></script>
<script src="static/js/layout.js"></script>
<script src="static/js/quests.js"></script>
</body>
</html>
