<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GuideBot · Jesus Christ The Truth</title>
    <meta name="description" content="Ask GuideBot questions about faith, the Bible and your spiritual journey.">
    <meta name="theme-color" content="#090f2e">
    <link rel="icon" href="static/image/jesusLogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="static/css/theme.css">
    <link rel="stylesheet" href="static/css/chatbot.css">
</head>
<body data-page="guidebot" data-auth="none" data-no-footer>
<main class="bot-page">
    <aside class="bot-side glass" id="bot-side" aria-label="Conversations">
        <div class="side-head">
            <img src="static/image/botLogo.png" alt="">
            <div><strong>GuideBot</strong><span>Your scriptural companion</span></div>
            <button class="icon-btn side-close" id="side-close" aria-label="Close conversations"><i class="fas fa-xmark"></i></button>
        </div>
        <button class="btn btn-block" id="new-chat"><i class="fas fa-plus"></i> New Conversation</button>
        <div class="side-list" id="side-list"></div>
    </aside>
    <div class="side-scrim" id="side-scrim"></div>

    <section class="bot-main glass" aria-label="Chat">
        <header class="bot-head">
            <button class="icon-btn side-open" id="side-open" aria-label="Show conversations"><i class="fas fa-bars-staggered"></i></button>
            <div class="bot-avatar"><img src="static/image/botLogo.png" alt=""><span class="pulse"></span></div>
            <div class="bot-title"><strong id="chat-title">New Conversation</strong><span><span class="status-dot on" style="display:inline-block;width:7px;height:7px"></span> GuideBot · online</span></div>
        </header>

        <div class="bot-body" id="bot-body" aria-live="polite"></div>

        <div class="starters" id="starters">
            <button class="starter">What is this website about?</button>
            <button class="starter">How can I start my Spiritual Journey?</button>
            <button class="starter">How can I get Closer To God?</button>
            <button class="starter">Who is Jesus?</button>
            <button class="starter">What is the Trinity?</button>
            <button class="starter">Why does God allow suffering?</button>
        </div>

        <form class="bot-input" id="bot-form">
            <input class="input" id="bot-text" placeholder="Ask about faith, the Bible or your journey…" autocomplete="off" maxlength="1000">
            <button class="btn" type="submit" aria-label="Send"><i class="fas fa-paper-plane"></i></button>
        </form>
    </section>
</main>
<script src="static/js/config.js"></script>
<script src="static/js/api.js"></script>
<script src="static/js/layout.js"></script>
<script src="static/js/guidebot-brain.js"></script>
<script src="static/js/chatbot.js"></script>
</body>
</html>
