<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Topics &amp; Testimonies · Jesus Christ The Truth</title>
    <meta name="description" content="Discuss biblical truths, ask questions and share testimonies with believers.">
    <meta name="theme-color" content="#090f2e">
    <link rel="icon" href="static/image/jesusLogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="static/css/theme.css">
    <link rel="stylesheet" href="static/css/topic.css">
</head>
<body data-page="topics" data-auth="none">
<main>
    <header class="page-hero">
        <div class="hero-halo"></div>
        <div class="hero-container hero-enter">
            <span class="eyebrow">Iron Sharpens Iron</span>
            <h1 class="page-title">Spiritual Topics</h1>
            <p class="lead">Ask questions, seek answers and share your testimony to encourage the brethren.</p>
            <p class="verse-reference">“Therefore encourage one another and build each other up.” — 1 Thessalonians 5:11</p>
        </div>
    </header>

    <div class="container forum">
        <div class="center" data-reveal="up">
            <div class="tabs" id="forum-tabs">
                <button class="tab active" data-tab="topics"><i class="fas fa-comments"></i> Discussions</button>
                <button class="tab" data-tab="testimonies"><i class="fas fa-hands-praying"></i> Testimonies</button>
            </div>
        </div>

        <!-- composer -->
        <div class="composer glass" id="composer" data-reveal="up">
            <div class="composer-head">
                <div class="me-badge" id="me-badge"><i class="fas fa-user"></i></div>
                <div>
                    <strong id="composer-title">Start a new topic</strong>
                    <span class="text-muted" id="composer-sub">What biblical question is on your heart?</span>
                </div>
            </div>
            <div class="editor" id="composer-editor">
                <div class="editor-toolbar" data-for="composer-input">
                    <button type="button" data-cmd="bold" title="Bold"><i class="fas fa-bold"></i></button>
                    <button type="button" data-cmd="italic" title="Italic"><i class="fas fa-italic"></i></button>
                    <button type="button" data-cmd="underline" title="Underline"><i class="fas fa-underline"></i></button>
                    <button type="button" data-cmd="insertUnorderedList" title="Bullet list"><i class="fas fa-list-ul"></i></button>
                    <button type="button" data-cmd="insertOrderedList" title="Numbered list"><i class="fas fa-list-ol"></i></button>
                </div>
                <div class="rich-input" id="composer-input" contenteditable="true" data-placeholder="Type your question or topic…"></div>
            </div>
            <div class="composer-foot">
                <span class="text-muted" id="composer-note"></span>
                <button class="btn" id="composer-post"><i class="fas fa-paper-plane"></i> <span>Post Topic</span></button>
            </div>
        </div>

        <div class="controls" data-reveal="up">
            <div class="field search"><i class="fas fa-magnifying-glass"></i><input class="input" id="search" placeholder="Search…" autocomplete="off"></div>
            <select class="select" id="sort" aria-label="Sort">
                <option value="favorites">Most favorited</option>
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="active">Most active</option>
                <option value="az">A – Z</option>
            </select>
        </div>

        <div id="topics-feed" class="feed"></div>
        <div id="testimonies-feed" class="testimony-grid" hidden></div>
    </div>
</main>

<script src="static/js/config.js"></script>
<script src="static/js/api.js"></script>
<script src="static/js/layout.js"></script>
<script src="static/js/forum.js"></script>
</body>
</html>
